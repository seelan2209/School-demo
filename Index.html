<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Vidya ERP – School Management Demo</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{--bg:#f5f6fb;--card:#fff;--tx:#1b2140;--mut:#6b7194;--pri:#3b3fd8;--nav:#161b4a;--bd:#e5e7f2;--ok:#16a34a;--bad:#dc2626;--warn:#d97706;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0f1226;--card:#181c3a;--tx:#e8eaf8;--mut:#9aa0c8;--bd:#2a2f58;--pri:#7c80ff}}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--tx)}
button,input,select,textarea{font:inherit;color:inherit}
.btn{background:var(--pri);color:#fff;border:0;border-radius:8px;padding:8px 14px;cursor:pointer;font-weight:600}.btn.g{background:transparent;color:var(--pri);border:1px solid var(--bd)}.btn.r{background:var(--bad)}.btn.s{padding:4px 9px;font-size:12px}
input,select,textarea{background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:8px 10px;width:100%}
.login{max-width:400px;margin:6vh auto;padding:24px}.card{background:var(--card);border-radius:14px;box-shadow:0 1px 3px #1b214014,0 8px 24px #1b21400a;padding:16px;margin-bottom:14px}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:14px 0}.tabs button{padding:8px 2px;border-radius:8px;border:1px solid var(--bd);background:var(--card);cursor:pointer}.tabs .on{background:var(--pri);color:#fff;border-color:var(--pri)}
.app{display:flex;min-height:100vh}.side{width:220px;background:var(--nav);color:#c9cdf5;padding:16px 10px;flex-shrink:0;position:sticky;top:0;height:100vh}.side b{color:#fff;font-size:17px;padding:0 8px;display:block;margin-bottom:14px}
.side a{display:block;padding:9px 10px;border-radius:8px;cursor:pointer;margin-bottom:2px}.side a.on,.side a:hover{background:#ffffff1f;color:#fff}
.main{flex:1;min-width:0;padding:16px}.top{display:flex;align-items:center;gap:10px;justify-content:space-between;margin-bottom:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:14px}.stat small{color:var(--mut)}.stat div{font-size:24px;font-weight:700}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:8px;border-bottom:1px solid var(--bd);white-space:nowrap}th{color:var(--mut);font-size:12px}
.pill{padding:2px 8px;border-radius:99px;font-size:12px;background:#3b3fd822;color:var(--pri)}.pill.ok{background:#16a34a22;color:var(--ok)}.pill.bad{background:#dc262622;color:var(--bad)}.pill.w{background:#d9770622;color:var(--warn)}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}.row>*{flex:1;min-width:120px}.bar{display:flex;align-items:flex-end;gap:6px;height:130px}.bar i{flex:1;background:var(--pri);border-radius:4px 4px 0 0;position:relative;min-height:2px}.bar i span{position:absolute;top:-16px;left:0;right:0;text-align:center;font-size:10px;font-style:normal}.lab{display:flex;gap:6px;font-size:10px;color:var(--mut)}.lab span{flex:1;text-align:center}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#161b4a;color:#fff;padding:10px 16px;border-radius:10px;z-index:99}
.modal{position:fixed;inset:0;background:#0009;z-index:50;overflow:auto;padding:16px}.sheet{background:#fff;color:#111;max-width:760px;margin:auto;padding:28px;border-radius:8px}.sheet table td,.sheet table th{color:#111;border:1px solid #ccc}
.drop{position:absolute;right:0;top:40px;width:300px;max-width:88vw;z-index:20}.mb{display:none}
@media(max-width:800px){.side{position:fixed;left:-240px;z-index:30;transition:.2s}.side.open{left:0}.mb{display:inline-block}}
@media print{body *{visibility:hidden}.sheet,.sheet *{visibility:visible}.sheet{position:absolute;left:0;top:0;width:100%}.noprint{display:none}}
</style></head><body><div id="root"></div>
<script>
const $=s=>document.querySelector(s);
const NAMES=["Aarav Sharma","Diya Sharma","Vihaan Patel","Ananya Iyer","Arjun Reddy","Ishita Nair","Kabir Singh","Meera Pillai","Rohan Gupta","Saanvi Rao","Aditya Menon","Kavya Joshi","Reyansh Das","Navya Kumar","Krishna Verma","Tanvi Desai"];
const SUBJ=["Mathematics","Science","English","Hindi","Social Science"],EXAMS=["Unit Test 1","Mid-Term","Final Exam"],CLASSES=["LKG","UKG",...Array.from({length:12},(_,i)=>"Grade "+(i+1))];
const USERS={admin:["admin@schooldemo.com","Admin123","Principal Rajesh Kumar"],teacher:["teacher@schooldemo.com","Teacher123","Mrs. Lakshmi Narayanan"],student:["student@schooldemo.com","Student123","Aarav Sharma"],parent:["parent@schooldemo.com","Parent123","Mr. Sanjay Sharma"]};
USERS.admin[3]="A";USERS.teacher[3]="T1";USERS.student[3]="S101";USERS.parent[3]="P1";
const CL=["Grade 8-A","Grade 8-B","Grade 9-A","Grade 5-A"];
const TEACH={T1:{name:"Mrs. Lakshmi Narayanan",cls:["Grade 8-A","Grade 8-B"],sub:["Mathematics"]},T2:{name:"Mr. Imran Sheikh",cls:["Grade 9-A","Grade 8-A","Grade 8-B"],sub:["Science"]},T3:{name:"Ms. Deepa Menon",cls:["Grade 5-A","Grade 8-A","Grade 9-A"],sub:["English"]},T4:{name:"Mr. Suresh Babu",cls:["Grade 8-B","Grade 5-A"],sub:["Hindi"]},T5:{name:"Mrs. Anitha Raj",cls:["Grade 9-A","Grade 5-A"],sub:["Social Science"]}};
const ACC=Object.values(USERS).map(u=>({role:Object.keys(USERS).find(k=>USERS[k]===u),email:u[0],pw:u[1],name:u[2],ref:u[3]}));
for(let t=2;t<=5;t++)ACC.push({role:"teacher",email:"teacher"+t+"@schooldemo.com",pw:"Teacher123",name:TEACH["T"+t].name,ref:"T"+t});
NAMES.slice(1,11).forEach((n,i)=>{const k=i+2;ACC.push({role:"student",email:"student"+k+"@schooldemo.com",pw:"Student123",name:n,ref:"S"+(100+k)});if(k>2)ACC.push({role:"parent",email:"parent"+k+"@schooldemo.com",pw:"Parent123",name:"Parent of "+n,ref:"P"+k})});
function start(a){role=a.role;U=[a.email,a.pw,a.name,a.ref];child=(DB.st.find(s=>s.parent==a.ref)||{id:"S101"}).id}
const myCls=()=>role=="teacher"?TEACH[U[3]].cls:CL,mySub=()=>role=="teacher"?TEACH[U[3]].sub:SUBJ;
const today=new Date().toISOString().slice(0,10),ago=n=>new Date(Date.now()-n*864e5).toISOString().slice(0,10);
function seed(){const st=NAMES.map((n,i)=>({id:"S"+(101+i),name:n,cls:i<2?(i?"Grade 5-A":"Grade 8-A"):["Grade 8-A","Grade 8-B","Grade 9-A"][i%3],roll:i+1,gender:i%2?"F":"M",parent:i<2?"P1":"P"+(i+1),status:"Active"}));st[1].cls="Grade 5-A";st[0].cls="Grade 8-A";
 const fees={},marks=[],att={};st.forEach((s,i)=>{fees[s.id]={total:62000,pay:i%3?[{id:"R"+s.id,amt:20000+(i%4)*10000,date:ago(30),mode:"UPI"}]:[]};
  for(let d=1;d<=14;d++)att[ago(d)+"|"+s.id]=(d*7+i)%11?"Present":"Absent";
  SUBJ.forEach((sub,k)=>marks.push({sid:s.id,exam:"Unit Test 1",sub,int:12+(i+k)%8,th:45+(i*7+k*5)%35,status:"Approved"}))});
 return{st,fees,marks,att,rem:{S101:"Excellent participation in class."},hw:[{id:1,cls:"Grade 8-A",title:"Algebra worksheet 4",sub:"Mathematics",due:ago(-3),subs:{S101:"Submitted"},fb:{S101:"Neat work!"}},{id:2,cls:"Grade 5-A",title:"Draw the water cycle",sub:"Science",due:ago(-4),subs:{},fb:{}}],
 ann:[{id:1,title:"Annual Day on 20 December",body:"All students to report by 8:30 AM.",to:"all",t:ago(1)}],
 notif:[{id:1,to:"all",text:"Welcome to Vidya ERP demo",t:ago(1),read:false},{id:2,to:"P1",text:"Fee instalment due on 15th",t:ago(0),read:false}]}}
let DB;try{DB=JSON.parse(localStorage.getItem("vidya2")||"null")}catch(e){}if(!DB)DB=seed();
const save=()=>{try{localStorage.setItem("vidya2",JSON.stringify(DB))}catch(e){}};
let U=null,role="admin",pg="dash",child="S101",q="",msg="",modal="";try{const s=JSON.parse(localStorage.getItem("vidya_s")||"null"),a=s&&ACC.find(x=>x.role==s.role&&x.email==s.email);if(a)start(a)}catch(e){}
const grade=p=>p>=90?"A+":p>=80?"A":p>=70?"B+":p>=60?"B":p>=50?"C":p>=40?"D":"F";
const inr=n=>"₹"+n.toLocaleString("en-IN"),stu=id=>DB.st.find(s=>s.id===id);
const paid=id=>DB.fees[id].pay.reduce((a,p)=>a+p.amt,0),attPct=id=>{const v=Object.entries(DB.att).filter(([k])=>k.endsWith("|"+id)).map(e=>e[1]);return v.length?Math.round(100*v.filter(x=>x!="Absent").length/v.length):100};
const notify=(to,text)=>{DB.notif.unshift({id:Date.now()+Math.random(),to,text,t:today,read:false})};
function toast(t){msg=t;draw();setTimeout(()=>{msg="";draw()},2200)}
const kids=()=>role=="student"?[stu(U[3])]:DB.st.filter(s=>s.parent==U[3]);
const myN=()=>DB.notif.filter(n=>n.to=="all"||n.to==role||(role=="parent"&&n.to==U[3])||(role=="student"&&n.to==U[3])||(role=="teacher"&&n.to=="teacher"));
const MENU={admin:[["dash","Dashboard"],["students","Students"],["att","Attendance"],["marks","Marks Approval"],["fees","Fees"],["ann","Announcements"],["rep","Report Cards"],["more","Teachers · Transport · Library"]],
teacher:[["dash","Dashboard"],["att","Attendance"],["marks","Marks Upload"],["hw","Homework"],["perf","Student Performance"],["tt","Timetable"],["prof","Profile"],["ann","Notices"]],
student:[["dash","Dashboard"],["att","My Attendance"],["res","My Results"],["hw","Homework"],["fees","Fees"],["rep","Report Card"],["tt","Timetable"],["prof","My Profile"],["ann","Notices"]],
parent:[["dash","Dashboard"],["att","Attendance"],["res","Results"],["hw","Homework"],["fees","Fees"],["rep","Report Card"],["prof","Children & Profile"],["ann","Notices"]]};
const tbl=(h,r)=>`<div class=tw><table><tr>${h.map(x=>`<th>${x}</th>`).join("")}</tr>${r.map(x=>`<tr>${x.map(c=>`<td>${c}</td>`).join("")}</tr>`).join("")||`<tr><td colspan=${h.length}>No records yet</td></tr>`}</table></div>`;
const stat=(a,b)=>`<div class="card stat"><small>${a}</small><div>${b}</div></div>`;
const chart=(d)=>{const m=Math.max(...d.map(x=>x[1]),1);return`<div class=bar>${d.map(x=>`<i style="height:${100*x[1]/m}%"><span>${x[1]}</span></i>`).join("")}</div><div class=lab>${d.map(x=>`<span>${x[0]}</span>`).join("")}</div>`};
const resFor=(sid,ex)=>{const r=DB.marks.filter(m=>m.sid==sid&&m.exam==ex&&m.status=="Approved");const t=r.reduce((a,m)=>a+m.int+m.th,0);return{r,t,max:r.length*100,p:r.length?Math.round(t/r.length):0}};
const cur=()=>role=="parent"?child:U[3];
function pageDash(){if(role=="teacher")return dashT();const ks=role=="admin"||role=="teacher"?null:cur();
 if(role=="admin"){const f=DB.st.reduce((a,s)=>a+paid(s.id),0),tot=DB.st.length*62000,pend=DB.marks.filter(m=>m.status=="Submitted").length;
  const by={};DB.st.forEach(s=>by[s.cls]=(by[s.cls]||0)+1);
  return`<div class=grid>${stat("Students",DB.st.length)}${stat("Teachers",20)}${stat("Classes","Grade 1–12")}${stat("Fees collected",inr(f))}${stat("Pending fees",inr(tot-f))}${stat("Marks awaiting approval",pend)}</div><div class=card><b>Class-wise strength</b>${chart(Object.entries(by))}</div>`}
 if(role=="teacher"){const n=DB.st.filter(s=>s.cls=="Grade 8-A").length;return`<div class=grid>${stat("My classes","8-A, 8-B")}${stat("Students in 8-A",n)}${stat("Today’s classes",4)}${stat("Drafts pending",DB.marks.filter(m=>m.status=="Draft").length)}</div><div class=card>Use Attendance and Marks Upload from the menu. Everything you save is visible to Admin, students and parents.</div>`}
 const s=stu(ks),r=resFor(ks,lastEx(ks)),h=DB.hw.filter(x=>x.cls==s.cls);
 return`<div class=card><b>${s.name}</b> · ${s.cls} · Roll ${s.roll} · ${s.id}</div><div class=grid>${stat("Attendance",attPct(ks)+"%")}${stat("Latest result",r.p+"% ("+grade(r.p)+")")}${stat("Fees pending",inr(62000-paid(ks)))}${stat("Homework pending",h.filter(x=>x.subs[ks]!="Submitted").length)}</div>${attPct(ks)<85?`<div class="card"><span class="pill bad">Low attendance warning</span> Attendance is below 85%.</div>`:""}`}
function pageStudents(){const l=DB.st.filter(s=>(s.name+s.cls+s.id).toLowerCase().includes(q.toLowerCase()));
 return`<div class=card><b>Admission form</b><div class=row><input id=nn placeholder="Student name"><select id=nc>${["Grade 8-A","Grade 8-B","Grade 9-A","Grade 5-A"].map(c=>`<option>${c}</option>`)}</select><select id=np><option value=P1>Link: Sharma family (parent demo)</option><option value=NEW>New parent account</option></select><button class=btn onclick=addStu()>Admit student</button></div></div>
 <input placeholder="Search students…" value="${q}" oninput="q=this.value;draw(1)" style="margin-bottom:10px"><div class=card>${tbl(["ID","Name","Class","Roll","Status",""],l.map(s=>[s.id,s.name,s.cls,s.roll,`<span class=pill>${s.status}</span>`,`<button class="btn r s" onclick="delStu('${s.id}')">Delete</button>`]))}</div>`}
function addStu(){const n=$("#nn").value.trim();if(n.length<3)return toast("Enter a valid name");const c=$("#nc").value,roll=DB.st.filter(s=>s.cls==c).length+1,id="S"+(101+DB.st.length+Math.floor(Math.random()*50));
 DB.st.push({id,name:n,cls:c,roll,gender:"M",parent:$("#np").value=="P1"?"P1":"PN"+id,status:"Active"});DB.fees[id]={total:62000,pay:[]};SUBJ.forEach(sub=>DB.marks.push({sid:id,exam:"Unit Test 1",sub,int:0,th:0,status:"Draft"}));
 notify("teacher","New student admitted: "+n+" ("+c+")");notify("P1","Admission confirmed for "+n);save();toast("Admitted "+n+" – ID "+id+", roll "+roll)}
function delStu(id){if(!confirm("Delete this student?"))return;DB.st=DB.st.filter(s=>s.id!=id);save();toast("Student deleted")}
function pageAtt(){
 if(role=="teacher"||role=="admin"){const c=$("#ac")?.value||myCls()[0],d=$("#ad")?.value||today,l=DB.st.filter(s=>s.cls==c);
  return`<div class=card><div class=row><select id=ac onchange=draw(1)>${myCls().map(x=>`<option ${x==c?"selected":""}>${x}</option>`)}</select><input type=date id=ad value="${d}" onchange=draw(1)>${role=="teacher"?`<button class=btn onclick=saveAtt()>Save attendance</button>`:""}</div>
  ${tbl(["Roll","Student","Status","% overall"],l.map(s=>[s.roll,s.name,role=="teacher"?`<select class=as data-id=${s.id}>${["Present","Absent","Late","Leave"].map(o=>`<option ${DB.att[d+"|"+s.id]==o?"selected":""}>${o}</option>`)}</select>`:`<span class="pill ${(DB.att[d+"|"+s.id]||"")=="Present"?"ok":"w"}">${DB.att[d+"|"+s.id]||"Not marked"}</span>`,attPct(s.id)+"%"]))}</div>`}
 const id=cur(),days=Object.keys(DB.att).filter(k=>k.endsWith("|"+id)).sort();
 return`<div class=card><b>${stu(id).name}</b> – ${attPct(id)}% attendance (${days.length} working days)<div style="display:flex;gap:4px;flex-wrap:wrap;margin-top:10px">${days.map(k=>`<span class="pill ${DB.att[k]=="Absent"?"bad":"ok"}" title="${DB.att[k]}">${k.slice(8,10)+"/"+k.slice(5,7)}</span>`).join("")}</div></div>`}
function saveAtt(){const d=$("#ad").value;document.querySelectorAll(".as").forEach(e=>{DB.att[d+"|"+e.dataset.id]=e.value;if(e.value=="Absent")notify(stu(e.dataset.id).parent,stu(e.dataset.id).name+" was marked absent on "+d)});save();toast("Attendance saved")}
function pageMarks(){
 if(role=="admin"){const l=DB.marks.filter(m=>m.status=="Submitted");return`<div class=card><b>Submitted marks awaiting approval</b>${tbl(["Student","Exam","Subject","Total",""],l.map(m=>[stu(m.sid)?.name,m.exam,m.sub,m.int+m.th+"/100",`<button class="btn s" onclick="appr('${m.sid}','${m.exam}','${m.sub}')">Approve</button>`]))}</div>`}
 const ex=$("#me")?.value||EXAMS[1],sb=$("#ms")?.value||mySub()[0],cl=$("#mc")?.value||myCls()[0],l=DB.st.filter(s=>s.cls==cl);
 const get=s=>DB.marks.find(m=>m.sid==s.id&&m.exam==ex&&m.sub==sb)||{int:"",th:"",status:"Not started"};
 return`<div class=card><div class=row><select disabled><option>2026–27</option></select><select id=mc onchange=draw(1)>${myCls().map(x=>`<option ${x==cl?"selected":""}>${x}</option>`)}</select><select id=me onchange=draw(1)>${EXAMS.map(x=>`<option ${x==ex?"selected":""}>${x}</option>`)}</select><select id=ms onchange=draw(1)>${mySub().map(x=>`<option ${x==sb?"selected":""}>${x}</option>`)}</select></div>
 ${tbl(["Roll","Student","Internal /20","Theory /80","Total /100","Grade","Status"],l.map(s=>{const m=get(s);const t=(+m.int||0)+(+m.th||0);const lock=m.status=="Approved";return[s.roll,s.name,`<input class=mi data-id=${s.id} type=number min=0 max=20 value="${m.int}" ${lock?"disabled":""} style="width:70px">`,`<input class=mt data-id=${s.id} type=number min=0 max=80 value="${m.th}" ${lock?"disabled":""} style="width:70px">`,t,grade(t),`<span class="pill ${lock?"ok":"w"}">${m.status}</span>`]}))}
 <div class=row style="margin-top:10px"><button class="btn g" onclick="saveMarks('Draft')">Save draft</button><button class=btn onclick="saveMarks('Submitted')">Submit to Admin</button></div></div>`}
function saveMarks(status){const ex=$("#me").value,sb=$("#ms").value;let bad=0;const ins=[...document.querySelectorAll(".mi")],ths=[...document.querySelectorAll(".mt")];
 ins.forEach((e,i)=>{const a=+e.value,b=+ths[i].value;if(a>20||b>80||a<0||b<0){bad=1;return}if(e.disabled)return;const id=e.dataset.id;let m=DB.marks.find(x=>x.sid==id&&x.exam==ex&&x.sub==sb);if(!m){m={sid:id,exam:ex,sub:sb};DB.marks.push(m)}m.int=a;m.th=b;m.status=status});
 if(bad)return toast("Marks exceed the maximum – fix and retry");if(status=="Submitted")notify("admin","Marks submitted: "+sb+" – "+ex);save();toast(status=="Draft"?"Draft saved":"Submitted for approval")}
function appr(s,e,b){DB.marks.filter(m=>m.sid==s&&m.exam==e&&m.sub==b).forEach(m=>m.status="Approved");notify(s,"Marks published: "+b+" ("+e+")");notify(stu(s).parent,"Marks published: "+b+" ("+e+")");save();toast("Approved & published")}
function pageRes(){const id=cur();return (DB.rem&&DB.rem[id]?`<div class=card><b>Teacher remarks:</b> ${DB.rem[id]}</div>`:"")+EXAMS.map(ex=>{const r=resFor(id,ex);return r.r.length?`<div class=card><b>${ex}</b> – ${r.p}% · Grade ${grade(r.p)}${tbl(["Subject","Internal","Theory","Total","Grade"],r.r.map(m=>[m.sub,m.int+"/20",m.th+"/80",m.int+m.th+"/100",grade(m.int+m.th)]))}</div>`:""}).join("")||`<div class=card>No published results yet.</div>`}
function pageHw(){const id=cur();
 if(role=="teacher")return`<div class=card><b>New homework</b><div class=row><input id=ht placeholder="Title"><input type=date id=hd value="${ago(-5)}"><button class=btn onclick=addHw()>Assign to 8-A</button></div></div><div class=card>${tbl(["Title","Due","Submitted","Review"],DB.hw.map(h=>[h.title,h.due,Object.keys(h.subs).length+" / "+DB.st.filter(s=>s.cls==h.cls).length,`<button class="btn g s" onclick="fb(${h.id})">Give feedback</button>`]))}</div>`;
 const s=stu(id);return`<div class=card>${tbl(["Title","Due","Status","Feedback",role=="student"?"":""],DB.hw.filter(h=>h.cls==s.cls).map(h=>[h.title,h.due,`<span class="pill ${h.subs[id]?"ok":"w"}">${h.subs[id]||"Pending"}</span>`,h.fb[id]||"–",role=="student"&&!h.subs[id]?`<button class="btn s" onclick="subHw(${h.id})">Submit</button>`:""]))}</div>`}
function addHw(){const t=$("#ht").value.trim();if(!t)return toast("Enter a title");DB.hw.unshift({id:Date.now(),cls:myCls()[0],title:t,sub:mySub()[0],due:$("#hd").value,subs:{},fb:{}});notify("student","New homework: "+t);notify("parent","New homework: "+t);save();toast("Homework assigned")}
function subHw(i){DB.hw.find(h=>h.id==i).subs[U[3]]="Submitted";save();toast("Homework submitted")}
function fb(i){const h=DB.hw.find(x=>x.id==i);Object.keys(h.subs).forEach(s=>h.fb[s]="Good work!");save();toast("Feedback sent")}
function pageFees(){
 if(role=="admin")return`<div class=card><b>Record payment</b><div class=row><select id=fs>${DB.st.map(s=>`<option value=${s.id}>${s.name} (${s.id})</option>`)}</select><input id=fa type=number placeholder="Amount ₹"><select id=fm><option>Cash</option><option>UPI</option><option>Cheque</option></select><button class=btn onclick=pay()>Record</button></div></div><div class=card>${tbl(["Student","Total","Paid","Pending"],DB.st.map(s=>[s.name,inr(62000),inr(paid(s.id)),inr(62000-paid(s.id))]))}</div>`;
 const id=cur();return`<div class=grid>${stat("Total",inr(62000))}${stat("Paid",inr(paid(id)))}${stat("Pending",inr(62000-paid(id)))}</div><div class=card><small>Structure: Tuition ₹48,000 · Transport ₹9,000 · Exams ₹5,000</small>${tbl(["Receipt","Date","Mode","Amount",""],DB.fees[id].pay.map(p=>[p.id,p.date,p.mode,inr(p.amt),`<button class="btn g s" onclick="rcpt('${id}','${p.id}')">Receipt</button>`]))}</div>`}
function pay(){const a=+$("#fa").value;if(a<=0)return toast("Enter a valid amount");const id=$("#fs").value;if(a>62000-paid(id))return toast("Amount exceeds pending balance");DB.fees[id].pay.push({id:"R"+Date.now().toString().slice(-6),amt:a,date:today,mode:$("#fm").value});notify(stu(id).parent,"Payment of "+inr(a)+" received for "+stu(id).name);save();toast("Payment recorded")}
function rcpt(id,r){const p=DB.fees[id].pay.find(x=>x.id==r),s=stu(id);modal=`<div class=sheet><h2>Fee Receipt ${p.id}</h2><p>Vidya International School<br>Student: ${s.name} (${s.id}) · ${s.cls}<br>Date: ${p.date} · Mode: ${p.mode}<br><b>Amount received: ${inr(p.amt)}</b><br>Balance: ${inr(62000-paid(id))}</p><div class=noprint><button class=btn onclick="print()">Print / Save PDF</button> <button class="btn g" onclick="modal='';draw()">Close</button></div></div>`;draw()}
function pageAnn(){return`${role=="admin"?`<div class=card><b>Publish announcement</b><div class=row><input id=at placeholder="Title"><select id=ato><option value=all>Everyone</option><option value=parent>Parents</option><option value=teacher>Teachers</option><option value=student>Students</option></select><button class=btn onclick=addAnn()>Publish</button></div></div>`:""}${DB.ann.map(a=>`<div class=card><b>${a.title}</b> <span class=pill>${a.to}</span><div style="color:var(--mut)">${a.body||""} · ${a.t}</div></div>`).join("")}`}
function addAnn(){const t=$("#at").value.trim();if(!t)return toast("Enter a title");const to=$("#ato").value;DB.ann.unshift({id:Date.now(),title:t,body:"",to,t:today});notify(to,"New announcement: "+t);save();toast("Published – notifications sent")}
function pageRep(){const ids=role=="admin"?DB.st:[stu(cur())];return`<div class=card>${tbl(["Student","Class","Exam",""],ids.map(s=>[s.name,s.cls,lastEx(s.id),`<button class=btn onclick="report('${s.id}')">View / Download</button>`]))}</div>`}
function report(id){const s=stu(id),ex=lastEx(id),r=resFor(id,ex);modal=`<div class=sheet><div style="text-align:center"><h2 style="margin:0">🏫 Vidya International School</h2><small>12, MG Road, Coimbatore, Tamil Nadu · Academic Year 2026–27</small><h3>Report Card – ${ex}</h3></div><p><b>${s.name}</b> · Adm No ${s.id} · ${s.cls} · Roll ${s.roll}</p>${tbl(["Subject","Max","Obtained","Grade"],r.r.map(m=>[m.sub,100,m.int+m.th,grade(m.int+m.th)]))}<p>Total: <b>${r.t}/${r.max}</b> · Percentage: <b>${r.p}%</b> · Grade ${grade(r.p)} · Result: <b>${r.p>=40?"PASS":"FAIL"}</b></p><p>Class teacher remarks: ${(DB.rem||{})[id]||(r.p>=75?"Excellent performance.":"Needs more focus and practice.")}</p><br><br><div style="display:flex;justify-content:space-between"><span>Class Teacher</span><span>Principal</span></div><div class=noprint style="margin-top:14px"><button class=btn onclick="print()">Print / Save PDF</button> <button class="btn g" onclick="modal='';draw()">Close</button></div></div>`;draw()}
function pageMore(){return`<div class=card><b>Teachers</b>${tbl(["ID","Name","Subject"],[["T01","Mrs. Lakshmi Narayanan","Mathematics"],["T02","Mr. Imran Sheikh","Science"],["T03","Ms. Deepa Menon","English"]])}</div><div class=card><b>Transport</b> – Bus 1 (Route: RS Puram → School), Driver: Murugan · <b>Library</b> – 1,240 books, 12 overdue. <span class="pill w">Demo-only modules</span></div><div class=card><small>Classes available: ${CLASSES.join(", ")}</small></div>`}
const DAYS=["Mon","Tue","Wed","Thu","Fri"],PER=["8:30","9:20","10:30","11:20","1:00"];
const tt=(c,d,p)=>SUBJ[(d+p+CL.indexOf(c))%5],grid=f=>tbl(["Time",...DAYS],PER.map((t,p)=>[t,...DAYS.map((_,d)=>f(d,p))]));
const tcell=(t,d,p)=>t.cls.filter(c=>t.sub.includes(tt(c,d,p))).map(c=>c+" · "+tt(c,d,p)).join(", ")||"–";
const lastEx=id=>[...EXAMS].reverse().find(e=>resFor(id,e).r.length)||EXAMS[0];
const ctOf=c=>{const k=Object.keys(TEACH).find(k=>TEACH[k].cls[0]==c);return k?TEACH[k].name:"–"};
function dashT(){const t=TEACH[U[3]],w=(new Date().getDay()+6)%7,d=w>4?0:w,n=DB.st.filter(s=>t.cls.includes(s.cls)).length;return`<div class=card><b>${U[2]}</b> · ${U[3]} · ${t.sub.join(", ")}<br><small>Classes: ${t.cls.join(", ")}</small></div><div class=grid>${stat("Assigned classes",t.cls.length)}${stat("Subjects",t.sub.length)}${stat("Total students",n)}${stat("Mark drafts",DB.marks.filter(m=>m.status=="Draft"&&t.cls.includes((stu(m.sid)||{}).cls)).length)}</div><div class=card><b>Today’s timetable (${DAYS[d]})</b>${tbl(["Time","Class · Subject"],PER.map((tm,p)=>[tm,tcell(t,d,p)]))}</div>`}
function pageTT(){if(role=="teacher"){const t=TEACH[U[3]];return`<div class=card>${grid((d,p)=>tcell(t,d,p))}</div>`}const s=stu(cur());return s?`<div class=card><b>${s.cls}</b>${grid((d,p)=>tt(s.cls,d,p))}</div>`:""}
function pageProf(){if(role=="teacher"){const t=TEACH[U[3]];return`<div class=card><b>${U[2]}</b><br>ID ${U[3]} · ${U[0]}<br>Classes: ${t.cls.join(", ")}<br>Subjects: ${t.sub.join(", ")}</div>`}return`<div class=card><b>${U[2]}</b> · ${U[0]}</div><div class=card>${tbl(["Name","Adm No","Class","Roll","Parent","Class teacher"],(role=="student"?[stu(U[3])]:kids()).map(s=>[s.name,s.id,s.cls,s.roll,(ACC.find(a=>a.role=="parent"&&a.ref==s.parent)||{}).name||"–",ctOf(s.cls)]))}</div>`}
function pagePerf(){const t=TEACH[U[3]];DB.rem=DB.rem||{};return`<div class=card>${tbl(["Student","Class","Latest %","Flag","Remark",""],DB.st.filter(s=>t.cls.includes(s.cls)).map(s=>{const p=resFor(s.id,lastEx(s.id)).p;return[s.name,s.cls,p+"%",p<60?`<span class="pill bad">Needs improvement</span>`:`<span class="pill ok">On track</span>`,`<input id=r_${s.id} value="${DB.rem[s.id]||""}" style="min-width:160px">`,`<button class="btn s" onclick="rem('${s.id}')">Save</button>`]}))}</div>`}
function rem(id){DB.rem=DB.rem||{};DB.rem[id]=$("#r_"+id).value;notify(stu(id).parent,"Teacher remark added for "+stu(id).name);save();toast("Remark saved")}
const PAGES={prof:pageProf,tt:pageTT,perf:pagePerf,dash:pageDash,students:pageStudents,att:pageAtt,marks:pageMarks,res:pageRes,hw:pageHw,fees:pageFees,ann:pageAnn,rep:pageRep,more:pageMore};
function setRole(r){role=r;draw()}function logout(){U=null;modal="";window.bell=0;window.nav=0;try{localStorage.removeItem("vidya_s")}catch(e){}draw()}function login(){const e=$("#em").value.trim().toLowerCase(),p=$("#pw").value,a=ACC.find(x=>x.role==role&&x.email==e&&x.pw==p);if(!a)return toast("Incorrect email or password for the "+role+" account");start(a);pg="dash";try{localStorage.setItem("vidya_s",JSON.stringify({email:a.email,role:a.role}))}catch(x){}draw()}
function draw(keep){let f=document.activeElement,fid=f&&f.id,pos=f&&f.selectionStart;
 if(!U){$("#root").innerHTML=`<div class=login><div class=card><h2 style="margin:0">🎓 Vidya ERP</h2><small style="color:var(--mut)">School management demo</small><div class=tabs>${["admin","teacher","student","parent"].map(r=>`<button class="${r==role?"on":""}" onclick="setRole('${r}')">${r[0].toUpperCase()+r.slice(1)}</button>`).join("")}</div><div class=row><input id=em value="${USERS[role][0]}"></div><div class=row><input id=pw type=password value="${USERS[role][1]}"></div><button class=btn style="width:100%" onclick=login()>${role[0].toUpperCase()+role.slice(1)} Login</button><p style="color:var(--mut);font-size:12px">Credentials are pre-filled for the demo.</p></div></div>${msg?`<div class=toast>${msg}</div>`:""}`;return}
 if(!MENU[role].some(m=>m[0]==pg))pg="dash";const nn=myN(),un=nn.filter(n=>!n.read).length;
 $("#root").innerHTML=`<div class=app><nav class="side ${window.nav?"open":""}"><b>🎓 Vidya ERP</b>${MENU[role].map(m=>`<a class="${m[0]==pg?"on":""}" onclick="pg='${m[0]}';window.nav=0;q='';draw()">${m[1]}</a>`).join("")}<a onclick="logout()" style="margin-top:20px">Logout</a></nav>
 <div class=main><div class=top><div><button class="btn g s mb" onclick="window.nav=!window.nav;draw()">☰</button> <b style="font-size:18px">${MENU[role].find(m=>m[0]==pg)[1]}</b><div style="color:var(--mut);font-size:12px">Home / ${role} / ${pg}</div></div><div style="position:relative;display:flex;gap:8px;align-items:center">${role=="parent"?`<select onchange="child=this.value;draw()" style="width:auto">${kids().map(k=>`<option value=${k.id} ${k.id==child?"selected":""}>${k.name}</option>`)}</select>`:""}<button class="btn g" onclick="window.bell=!window.bell;draw()">🔔 ${un}</button><span class=pill>${U[2]}</span>${window.bell?`<div class="card drop"><b>Notifications</b>${nn.slice(0,8).map(n=>`<div style="padding:6px 0;border-bottom:1px solid var(--bd);${n.read?"opacity:.55":""}">${n.text}<br><small style="color:var(--mut)">${n.t}</small></div>`).join("")||"Nothing yet"}<button class="btn g s" onclick="myN().forEach(n=>n.read=true);save();draw()">Mark all read</button></div>`:""}</div></div>${PAGES[pg]()}</div></div>${modal?`<div class=modal>${modal}</div>`:""}${msg?`<div class=toast>${msg}</div>`:""}`;
 if(fid&&$("#"+fid)){$("#"+fid).focus();try{$("#"+fid).setSelectionRange(pos,pos)}catch(e){}}}
draw();
</script></body></html>
